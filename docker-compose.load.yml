# Load-testing overlay - adds a `k6` runner service that talks to the
# backend over the docker compose network.
#
# The k6 container has the load scripts mounted at /scripts. Use
# `docker compose run --rm k6 run /scripts/<scenario>.js`.

services:
  k6:
    image: grafana/k6:0.54.0
    container_name: pyholdem-k6
    profiles:
      # Default profile - k6 only starts when explicitly invoked,
      # not on `docker compose up`.
      - load
    # The grafana/k6 image runs its entrypoint as the non-root `k6`
    # user (UID 12345). Docker initialises named volumes as root:root
    # mode 0755, so without this override k6 cannot create
    # /results/last_run.json (K6_OUT) and aborts during the "Starting
    # outputs" init phase with `permission denied`. Running as root
    # inside the throwaway container is the standard fix and matches
    # the pattern documented in grafana/k6 issues for bind/named
    # volume output.
    user: "0:0"
    environment:
      BASE_URL: http://backend:8000
      WS_URL: ws://backend:8000
      K6_OUT: "json=/results/last_run.json"
    volumes:
      - ./scripts/load:/scripts:ro
      - k6_results:/results
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["k6"]

volumes:
  k6_results:

# Grafana datasource provisioning - auto-configures Prometheus on startup.
#
# Container hostname "prometheus" resolves inside the docker compose
# network (see docker-compose.observability.yml).

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST

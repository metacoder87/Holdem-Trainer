# Prometheus scrape config for the PyHoldem stack.
#
# Scrapes the backend's /metrics endpoint every 10 seconds. The backend
# service name resolves inside the docker network ("backend:8000"), so
# this file works as-is when launched via:
#
#     docker compose -f docker-compose.yml -f docker-compose.observability.yml up
#
# For local dev outside docker, swap host.docker.internal -> localhost
# in the scrape config.

global:
  scrape_interval: 10s
  evaluation_interval: 30s
  external_labels:
    service: pyholdem
    env: dev

scrape_configs:
  - job_name: pyholdem-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          component: backend

  # Prometheus self-monitoring (free, useful for spotting scrape failures).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Alert rules + Alertmanager are deferred until distributed tracing
# lands. The Four Golden Signals dashboards visualize alert-worthy
# conditions in the meantime.

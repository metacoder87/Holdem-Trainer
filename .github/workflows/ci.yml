# PyHoldem Pro - CI pipeline (PR + main pushes)
#
# Three independent jobs that fan out in parallel:
#
#   backend     pytest + flake8 (single Python 3.11; the matrix from
#               the old workflow was dropped because 3.8-3.10 are EOL
#               and adding them just slowed the pipeline)
#   frontend    typecheck + vitest + production build
#   docker      build images, boot the full stack, run the k6 smoke
#               scenario against /health and a couple of routes
#
# The docker job is the integration gate: if compose can't bring the
# stack up healthy and the smoke load-test can't hit every major
# endpoint, the PR doesn't merge.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r backend/requirements.txt

      - name: Lint (flake8 - syntax + undefined names only)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest (entire backend test suite)
        env:
          PYTHONPATH: src:backend
        run: |
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    # Boot the compose stack and run k6 smoke against it. This catches
    # bugs that only show up when services talk to each other (CORS,
    # postgres readiness races, wrong env var names, missing migrations).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (cached)
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          load: true
        # bake-action wraps buildx for us. Falls back to plain docker
        # compose build if you'd rather: `docker compose build`.

      - name: Boot the stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.load.yml up -d --wait \
              --wait-timeout 120 \
              db backend frontend

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend healthy."
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend never became healthy."
          docker compose logs backend
          exit 1

      - name: Run k6 smoke scenario
        run: |
          docker compose -f docker-compose.yml -f docker-compose.load.yml \
              run --rm k6 run /scripts/smoke.js

      - name: Surface backend logs on failure
        if: failure()
        run: docker compose logs --tail=200 backend db

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.load.yml down -v

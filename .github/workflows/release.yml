# PyHoldem Pro - release pipeline
#
# Triggers:
#   push to main          -> build + push images tagged with :main + :<sha>
#   tag v*                -> additionally tag :latest + :<tag>
#   workflow_dispatch     -> manual run (good for hotfix builds)
#
# Pushes both backend + frontend images to GitHub Container Registry
# under the repo's `pyholdem-pro-{backend,frontend}` namespace. The
# GITHUB_TOKEN has packages:write automatically; no manual secret needed.
#
# .npz CFR strategy files are NOT pushed in this workflow - they're
# produced by cfr-models.yml and attached as Release Assets. Backend
# images fetch them at runtime via the PYHOLDEM_CFR_RELEASE_TAG env
# var (see backend/Dockerfile.backend startup hook).

name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Optional extra tag to push (e.g. rc1)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write   # reserved for future cosign signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release mid-flight

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: pyholdem-pro-backend
            dockerfile: Dockerfile.backend
            context: .
          - image: pyholdem-pro-frontend
            dockerfile: Dockerfile.frontend
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag_override }},enable=${{ inputs.tag_override != '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Frontend Dockerfile needs the VITE_* args.
          build-args: |
            VITE_API_URL=http://localhost:8000
            VITE_WS_URL=ws://localhost:8000

  # Smoke-test the published image to make sure we didn't break
  # anything that the CI compose stack would have caught.
  smoke-test-image:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start backend image
        run: |
          docker run -d --rm \
            -p 8000:8000 \
            -e PYHOLDEM_DATA_FILE=/tmp/players.json \
            -e PYHOLDEM_CORS_ORIGINS=http://localhost \
            --name pyholdem-smoke \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pyholdem-pro-backend:sha-${{ github.sha }}

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Image healthy."
              exit 0
            fi
            sleep 2
          done
          docker logs pyholdem-smoke
          exit 1

      - name: Smoke-hit /metrics
        run: |
          curl -sf http://localhost:8000/metrics | head -20

      - name: Stop
        if: always()
        run: docker stop pyholdem-smoke || true
